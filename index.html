<!DOCTYPE html>
<!-- lang="en" tells the browser that the page is in English -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page look right on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tracker</title>
  <!-- Browser tab icon (a money bag emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <!-- Connect the stylesheet (how the page looks) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>My Tracker</h1>
    <p class="subtitle">Budget</p>
  </header>

  <main class="container">

    <!-- ===== Block 1: Current balance ===== -->
    <section class="card balance-card">
      <p class="label">Current balance</p>
      <!-- JavaScript puts the amount here. The id lets the code find this element -->
      <p id="balance" class="balance">₴0.00</p>
    </section>

    <!-- ===== Block 2: Form for adding an entry ===== -->
    <section class="card">
      <h2>New entry</h2>

      <form id="record-form">
        <!-- "Expense / Income" switch. These are radio buttons: only one can be selected -->
        <div class="type-switch">
          <label>
            <input type="radio" name="type" value="expense" checked>
            <span>Expense</span>
          </label>
          <label>
            <input type="radio" name="type" value="income">
            <span>Income</span>
          </label>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>Amount, ₴</span>
            <!-- inputmode="decimal" opens the number keyboard on phones -->
            <input type="number" id="amount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
          </label>

          <label class="field">
            <span>Category</span>
            <!-- JavaScript fills this list (it is different for income and expenses) -->
            <select id="category" required></select>
          </label>

          <label class="field">
            <span>Date</span>
            <input type="date" id="date" required>
          </label>

          <label class="field">
            <span>Comment</span>
            <input type="text" id="comment" maxlength="100" placeholder="Optional">
          </label>
        </div>

        <button type="submit" class="btn-primary">Add</button>
      </form>
    </section>

    <!-- ===== Block 3: Monthly summary ===== -->
    <section class="card">
      <div class="card-header">
        <h2>Monthly summary</h2>
        <!-- Month picker -->
        <input type="month" id="month">
      </div>

      <div class="month-totals">
        <div>
          <p class="label">Income</p>
          <p id="month-income" class="amount income">₴0.00</p>
        </div>
        <div>
          <p class="label">Expenses</p>
          <p id="month-expense" class="amount expense">₴0.00</p>
        </div>
      </div>

      <h3>Expenses by category</h3>
      <!-- JavaScript adds a row for each category here -->
      <ul id="category-list" class="category-list"></ul>
    </section>

    <!-- ===== Block 4: List of all entries ===== -->
    <section class="card">
      <h2>All entries</h2>
      <ul id="record-list" class="record-list"></ul>
    </section>

  </main>

  <!-- Connect the logic file. It goes at the very end so that the whole page
       above is already loaded when the script starts -->
  <script src="budget.js"></script>
</body>
</html>
